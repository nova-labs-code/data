<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Pi Data</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: #050505;
            color: #fff;
            font-family: monospace;
        }

        body {
            padding: 12px;
        }

        .container {
            width: 100%;
            margin: 0 auto;
        }

        h1 {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 26px;
        }

        .subtitle {
            color: #777;
            margin: 3px 0 14px;
        }

        .status {
            margin-bottom: 12px;
            padding: 9px 11px;
            border-radius: 8px;
            background: #0d0d0d;
            border: 1px solid #222;
            color: #888;
            font-size: 12px;
        }

        .status.loaded {
            color: #8cff8c;
        }

        .status.error {
            color: #ff6666;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 7px;
            margin-bottom: 16px;
        }

        .card {
            padding: 10px;
            border: 1px solid #202020;
            border-radius: 9px;
            background: #0a0a0a;
        }

        .label {
            color: #666;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: .07em;
            margin-bottom: 4px;
        }

        .value {
            font-size: 15px;
        }

        .frequency-title {
            margin: 18px 0 8px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 17px;
        }

        .frequency {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 6px;
            margin-bottom: 18px;
        }

        .frequency-card {
            background: #0a0a0a;
            border: 1px solid #202020;
            border-radius: 8px;
            padding: 9px 4px;
            text-align: center;
        }

        .digit {
            font-size: 20px;
            font-weight: bold;
        }

        .count {
            margin-top: 4px;
            color: #999;
            font-size: 11px;
        }

        /*
         * The digits are kept on one continuous line
         * and wrapped naturally by the browser.
         *
         * No fixed character count.
         * No artificial 32-digit limit.
         */
        #digits {
            width: 100%;
            font-size: clamp(11px, 2.7vw, 22px);
            line-height: 1.6;
            letter-spacing: 0;
            word-break: break-all;
            overflow-wrap: anywhere;
        }

        @media (min-width: 600px) {
            .stats {
                grid-template-columns: repeat(4, 1fr);
            }

            .frequency {
                grid-template-columns: repeat(10, 1fr);
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>π Data</h1>

    <div class="subtitle">
        digits.pi.data
    </div>

    <div id="status" class="status">
        Loading...
    </div>

    <div class="stats">

        <div class="card">
            <div class="label">Total Digits</div>
            <div id="totalDigits" class="value">—</div>
        </div>

        <div class="card">
            <div class="label">Decimal Places</div>
            <div id="decimalDigits" class="value">—</div>
        </div>

        <div class="card">
            <div class="label">File Size</div>
            <div id="fileSize" class="value">—</div>
        </div>

        <div class="card">
            <div class="label">Digit Lines</div>
            <div id="lines" class="value">—</div>
        </div>

    </div>

    <h2 class="frequency-title">
        Digit Frequency
    </h2>

    <div class="frequency">

        <div class="frequency-card">
            <div class="digit">0</div>
            <div id="count0" class="count">—</div>
        </div>

        <div class="frequency-card">
            <div class="digit">1</div>
            <div id="count1" class="count">—</div>
        </div>

        <div class="frequency-card">
            <div class="digit">2</div>
            <div id="count2" class="count">—</div>
        </div>

        <div class="frequency-card">
            <div class="digit">3</div>
            <div id="count3" class="count">—</div>
        </div>

        <div class="frequency-card">
            <div class="digit">4</div>
            <div id="count4" class="count">—</div>
        </div>

        <div class="frequency-card">
            <div class="digit">5</div>
            <div id="count5" class="count">—</div>
        </div>

        <div class="frequency-card">
            <div class="digit">6</div>
            <div id="count6" class="count">—</div>
        </div>

        <div class="frequency-card">
            <div class="digit">7</div>
            <div id="count7" class="count">—</div>
        </div>

        <div class="frequency-card">
            <div class="digit">8</div>
            <div id="count8" class="count">—</div>
        </div>

        <div class="frequency-card">
            <div class="digit">9</div>
            <div id="count9" class="count">—</div>
        </div>

    </div>

    <div id="digits"></div>

</div>

<script>
    const FILE = "digits.pi.data";

    function formatNumber(number) {
        return number.toLocaleString();
    }

    function formatBytes(bytes) {
        if (bytes < 1024) {
            return bytes + " B";
        }

        if (bytes < 1024 * 1024) {
            return (bytes / 1024).toFixed(2) + " KB";
        }

        if (bytes < 1024 * 1024 * 1024) {
            return (bytes / (1024 * 1024)).toFixed(2) + " MB";
        }

        return (bytes / (1024 * 1024 * 1024)).toFixed(2) + " GB";
    }

    function calculateLineCount(text) {
        const container =
            document.getElementById("digits");

        const test =
            document.createElement("span");

        test.style.visibility = "hidden";
        test.style.position = "absolute";
        test.style.whiteSpace = "nowrap";

        test.textContent = "0".repeat(1000);

        container.appendChild(test);

        const digitWidth =
            test.getBoundingClientRect().width / 1000;

        container.removeChild(test);

        if (!digitWidth) {
            return 0;
        }

        const availableWidth =
            container.clientWidth;

        const digitsPerLine =
            Math.max(
                1,
                Math.floor(
                    availableWidth / digitWidth
                )
            );

        return Math.ceil(
            text.length / digitsPerLine
        );
    }

    async function loadPi() {
        const status =
            document.getElementById("status");

        try {
            const response =
                await fetch(FILE, {
                    cache: "no-cache"
                });

            if (!response.ok) {
                throw new Error(
                    "File could not be loaded."
                );
            }

            const raw =
                await response.text();

            /*
             * Keep numbers and decimal point.
             */
            const data =
                raw.replace(/[^0-9.]/g, "");

            if (!data) {
                throw new Error(
                    "No digits found."
                );
            }

            /*
             * Remove the decimal point for
             * counting digit occurrences.
             */
            const decimalIndex =
                data.indexOf(".");

            let digits;
            let decimalPlaces;

            if (decimalIndex === -1) {
                digits = data;
                decimalPlaces = 0;
            } else {
                digits =
                    data.slice(0, decimalIndex) +
                    data.slice(decimalIndex + 1);

                decimalPlaces =
                    data.length -
                    decimalIndex -
                    1;
            }

            /*
             * General statistics.
             */
            document.getElementById(
                "totalDigits"
            ).textContent =
                formatNumber(digits.length);

            document.getElementById(
                "decimalDigits"
            ).textContent =
                formatNumber(decimalPlaces);

            document.getElementById(
                "fileSize"
            ).textContent =
                formatBytes(
                    new Blob([raw]).size
                );

            /*
             * Count each digit.
             */
            const counts =
                Array(10).fill(0);

            for (const character of digits) {
                const number =
                    Number(character);

                if (
                    Number.isInteger(number) &&
                    number >= 0 &&
                    number <= 9
                ) {
                    counts[number]++;
                }
            }

            /*
             * Display frequencies.
             */
            for (let i = 0; i <= 9; i++) {
                document.getElementById(
                    "count" + i
                ).textContent =
                    formatNumber(counts[i]) +
                    " times";
            }

            /*
             * Display the actual π data.
             *
             * Nothing is manually split here.
             * The browser uses the full width
             * available and wraps naturally.
             */
            document.getElementById(
                "digits"
            ).textContent = data;

            /*
             * Calculate approximate number
             * of visible lines.
             */
            requestAnimationFrame(() => {
                document.getElementById(
                    "lines"
                ).textContent =
                    formatNumber(
                        calculateLineCount(data)
                    );
            });

            status.textContent =
                "Loaded successfully";

            status.className =
                "status loaded";

        } catch (error) {

            console.error(error);

            status.textContent =
                "Unable to load digits.pi.data";

            status.className =
                "status error";
        }
    }

    loadPi();
</script>

</body>
</html>
