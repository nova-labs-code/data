<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Pi Digits</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
            background: #000;
            color: #fff;
            font-family: monospace;
        }

        body {
            padding: 20px;
        }

        #digits {
            white-space: pre-wrap;
            word-break: break-all;
            overflow-wrap: anywhere;
            font-size: 18px;
            line-height: 1.6;
        }

        #error {
            display: none;
            color: #ff5555;
        }
    </style>
</head>

<body>

    <div id="digits"></div>
    <div id="error">Could not load digits.pi.data</div>

    <script>
        async function loadPiDigits() {
            try {
                const response = await fetch("digits.pi.data", {
                    cache: "no-cache"
                });

                if (!response.ok) {
                    throw new Error("Failed to load file");
                }

                const data = await response.text();

                // Keep numbers and the decimal point
                const pi = data.replace(/[^0-9.]/g, "");

                document.getElementById("digits").textContent = pi;
            } catch (error) {
                document.getElementById("error").style.display = "block";
            }
        }

        loadPiDigits();
    </script>

</body>
</html>
